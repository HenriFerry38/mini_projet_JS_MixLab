<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MixLab</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero__overlay"></div>

    <div class="container hero__content">
      <h1 class="hero__title">MixLab</h1>
      <p class="hero__subtitle">Explore, filtre et découvre des cocktails en quelques clics.</p>

      <div class="hero__controls">
        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            placeholder="Rechercher un cocktail..."
            aria-label="Rechercher un cocktail"
          />
        </div>

        <div class="filters">
          <button id="randomBtn" class="btn btn--gold">Cocktail surprise</button>

          <select id="alcoholFilter" class="select">
            <option value="all">Tous</option>
            <option value="avec">Avec alcool</option>
            <option value="sans">Sans alcool</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="cocktails-section container">
      <div class="section-heading">
        <h2>Cocktails</h2>
      </div>

      <p id="statusMessage" class="status-message"></p>

      <div id="cocktailsGrid" class="cocktails-grid"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__brand">MixLab</div>
      <p>Mentions légales • Politique de confidentialité</p>
    </div>
  </footer>

  <div id="recipeModal" class="modal hidden" aria-hidden="true">
    <div class="modal__backdrop" id="modalBackdrop"></div>

    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="closeModalBtn" class="modal__close" aria-label="Fermer">×</button>

      <div class="modal__image-wrap">
        <img id="modalImage" src="" alt="" />
      </div>

      <div class="modal__content">
        <h3 id="modalTitle"></h3>

        <div class="modal__badges">
          <span id="modalCategory" class="badge"></span>
          <span id="modalDifficulty" class="badge"></span>
          <span id="modalAlcohol" class="badge"></span>
        </div>

        <p id="modalDescription" class="modal__description"></p>

        <div class="modal__block">
          <h4>Ingrédients</h4>
          <ul id="modalIngredients"></ul>
        </div>

        <div class="modal__block">
          <h4>Préparation</h4>
          <p id="modalInstructions"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
